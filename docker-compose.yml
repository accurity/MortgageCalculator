services:
  hypotheek:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    env_file:
      - .env
    # Los van wat .env voor lokale (niet-gecontaineriseerde) tests gebruikt:
    # in docker-compose praat de app altijd met de mariadb-service hiernaast.
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: hypotheek
      DB_USERNAME: hypotheek
      DB_PASSWORD: hypotheek
    depends_on:
      db:
        condition: service_healthy
    # Broncode vanaf de host, zodat een wijziging direct zichtbaar is zonder
    # rebuild. Read-only: de app schrijft zelf niets naar deze mappen; wat de
    # app wel beschrijft (storage/, bootstrap/cache/) blijft in het image.
    volumes:
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./public:/var/www/html/public:ro
      - ./resources:/var/www/html/resources:ro
      - ./routes:/var/www/html/routes:ro
      # Enige uitzondering op read-only: logo-uploads schrijven hierheen.
      - ./public/logos:/var/www/html/public/logos:rw

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: hypotheek
      MARIADB_USER: hypotheek
      MARIADB_PASSWORD: hypotheek
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - hypotheek-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hypotheek-db:
